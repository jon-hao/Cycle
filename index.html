<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Cycle — private macro dashboard"
    />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0f6e56" />
    <title>Cycle</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20261102h" />
  </head>
  <body>
    <div id="loginView" class="login-view" hidden>
      <div class="login-lang-wrap">
        <div class="sq-select" id="loginLangSelect" data-value="zh"></div>
      </div>
      <form id="loginForm" class="login-card" autocomplete="on">
        <h1 class="login-brand">Cy<span>cle</span></h1>
        <p class="login-muted" data-i18n="loginTagline">Private dashboard — sign in</p>
        <label>
          <span data-i18n="loginEmail">Email</span>
          <input id="loginEmail" name="email" type="email" required autocomplete="username" />
        </label>
        <label>
          <span data-i18n="loginPassword">Password</span>
          <div class="pwd-wrap">
            <input
              id="loginPassword"
              name="password"
              type="password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <button type="submit" class="login-btn" id="loginBtn">
          <span class="login-btn-label" data-i18n="loginSubmit">Sign in</span>
        </button>
        <button type="button" class="text-btn login-secondary" id="showPwdForm" data-i18n="changePassword">
          Change password
        </button>
        <p id="loginErr" class="login-err" role="alert"></p>
      </form>
      <form id="pwdForm" class="login-card" autocomplete="on" hidden>
        <h1 class="login-brand">Cy<span>cle</span></h1>
        <p class="login-muted" data-i18n="changePassword">Change password</p>
        <label>
          <span data-i18n="loginEmail">Email</span>
          <input id="pwdEmail" name="email" type="email" required autocomplete="username" />
        </label>
        <label>
          <span data-i18n="currentPassword">Current password</span>
          <div class="pwd-wrap">
            <input id="pwdCurrent" type="password" required autocomplete="current-password" />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <label>
          <span data-i18n="newPassword">New password</span>
          <div class="pwd-wrap">
            <input id="pwdNew" type="password" required autocomplete="new-password" minlength="8" />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <label>
          <span data-i18n="confirmPassword">Confirm new password</span>
          <div class="pwd-wrap">
            <input id="pwdConfirm" type="password" required autocomplete="new-password" minlength="8" />
            <button type="button" class="pwd-toggle" data-pwd-toggle aria-label="Show password">
              <span class="pwd-eye-show" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </span>
              <span class="pwd-eye-hide" hidden aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M7.1 7.3C4.7 8.7 3 12 3 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M16.9 16.7C19.3 15.3 21 12 21 12s-3.5-7-10-7c-.7 0-1.4.1-2 .2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
            </button>
          </div>
        </label>
        <button type="submit" class="login-btn" id="pwdSave">
          <span data-i18n="savePassword">Save</span>
        </button>
        <button type="button" class="text-btn login-secondary" id="backToLogin" data-i18n="backToLogin">
          Back to sign in
        </button>
        <p id="pwdErr" class="login-err" role="alert"></p>
      </form>
    </div>

    <div class="app-shell" id="appShell">
      <header class="site-header">
        <div class="header-side header-left" aria-hidden="true"></div>
        <div class="header-center">
          <h1 class="brand">Cy<span>cle</span></h1>
        </div>
        <div class="header-side header-right">
          <div class="sq-select" id="langSelect" data-value="zh"></div>
          <button
            type="button"
            class="icon-btn icon-only"
            id="themeBtn"
            aria-label="Theme"
            title="Theme"
          >
            <span class="theme-icon theme-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
                <path
                  d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="theme-icon theme-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M18.5 14.2A7.2 7.2 0 0 1 9.8 5.5 7.5 7.5 0 1 0 18.5 14.2z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </div>
      </header>

      <main id="main" class="site-main" aria-live="polite"></main>

      <nav class="site-footer" id="siteFooter" aria-label="Primary">
        <span class="footer-spacer" aria-hidden="true"></span>
        <div class="footer-pill">
          <button type="button" class="nav-btn active" data-page="data" data-i18n="navData">
            数据
          </button>
          <button type="button" class="nav-btn" data-page="relations" data-i18n="navRelations">
            关系
          </button>
          <button type="button" class="nav-btn" data-page="insight" data-i18n="navInsight">
            见闻
          </button>
          <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
        </div>
        <button
          type="button"
          class="refresh-fab"
          id="refreshFab"
          aria-label="Auto refresh"
          aria-pressed="false"
          data-on="0"
          title="自动刷新关"
        >
          <span class="refresh-fab-label">OFF</span>
        </button>
      </nav>
      <div class="ptr-indicator" id="ptrIndicator" hidden></div>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <script src="./js/config.js?v=20261102h"></script>
    <script src="./js/i18n.js?v=20261102h"></script>
    <script src="./js/tz.js?v=20261102h"></script>
    <script src="./js/translate.js?v=20261102h"></script>
    <script src="./js/api.js?v=20261102h"></script>
    <script src="./js/board.js?v=20261102h"></script>
    <script src="./js/kondratiev.js?v=20261102h"></script>
    <script src="./js/llm.js?v=20261102h"></script>
    <script src="./js/md.js?v=20261102h"></script>
    <script src="./js/ai-ui.js?v=20261102h"></script>
    <script src="./js/agent.js?v=20261102h"></script>
    <script src="./js/cal-i18n.js?v=20261102h"></script>
    <script src="./js/charts.js?v=20261102h"></script>
    <script src="./js/pages/data.js?v=20261102h"></script>
    <script src="./js/pages/news.js?v=20261102h"></script>
    <script src="./js/pages/calendar.js?v=20261102h"></script>
    <script src="./js/pages/insight.js?v=20261102h"></script>
    <script src="./js/pages/relations.js?v=20261102h"></script>
    <script src="./js/app.js?v=20261102h"></script>
  </body>
</html>
