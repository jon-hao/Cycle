<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Cycle — global macro dashboard with Kondratiev context, local LLM briefs, news and calendar"
    />
    <meta name="theme-color" content="#0f6e56" />
    <title>Cycle · Global Macro</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="header-left">
          <div class="brand-block">
            <h1 class="brand">Cy<span>cle</span></h1>
            <p class="tagline" data-i18n="tagline">全球经济看板</p>
          </div>
          <label class="sr-only" for="countrySelect" data-i18n="country">国家</label>
          <select id="countrySelect" aria-label="Country">
            <option value="US">🇺🇸 United States</option>
            <option value="CN">🇨🇳 China</option>
            <option value="GLOBAL">🌍 Global</option>
          </select>
          <span id="kBadge" class="k-badge" title="">K6 · Spring</span>
        </div>
        <div class="header-right">
          <span id="llmStatus" class="llm-status">Ollama …</span>
          <button type="button" class="icon-btn" id="themeBtn">Dark</button>
          <button type="button" class="icon-btn" id="langBtn">EN</button>
        </div>
      </header>

      <main id="main" class="site-main" aria-live="polite"></main>

      <nav class="site-footer" aria-label="Primary">
        <button type="button" class="nav-btn active" data-page="data" data-i18n="navData">
          数据
        </button>
        <button type="button" class="nav-btn" data-page="news" data-i18n="navNews">
          新闻
        </button>
        <button type="button" class="nav-btn" data-page="calendar" data-i18n="navCalendar">
          日历
        </button>
      </nav>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>

    <script src="./js/i18n.js"></script>
    <script src="./js/kondratiev.js"></script>
    <script src="./js/llm.js"></script>
    <script src="./js/charts.js"></script>
    <script src="./js/pages/data.js"></script>
    <script src="./js/pages/news.js"></script>
    <script src="./js/pages/calendar.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
