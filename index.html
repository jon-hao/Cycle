<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Cycle — global macro dashboard with Kondratiev context, local LLM briefs, news and calendar"
    />
    <meta name="theme-color" content="#0f6e56" />
    <title>Cycle</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20261016e" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="header-side header-left">
          <div class="sq-select" id="countrySelect" data-value="US"></div>
        </div>
        <div class="header-center">
          <h1 class="brand">Cy<span>cle</span></h1>
        </div>
        <div class="header-side header-right">
          <div class="sq-select" id="langSelect" data-value="zh"></div>
          <button
            type="button"
            class="icon-btn icon-only"
            id="themeBtn"
            aria-label="Theme"
            title="Theme"
          >
            <span class="theme-icon theme-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
                <path
                  d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="theme-icon theme-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M18.5 14.2A7.2 7.2 0 0 1 9.8 5.5 7.5 7.5 0 1 0 18.5 14.2z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
        </div>
      </header>

      <main id="main" class="site-main" aria-live="polite"></main>

      <nav class="site-footer" id="siteFooter" aria-label="Primary">
        <button type="button" class="model-fab" id="modelFab" aria-label="Model">
          <span class="model-fab-ring" id="modelFabRing"></span>
          <span class="model-fab-label" id="modelFabLabel">AI</span>
        </button>
        <div class="footer-pill">
          <button type="button" class="nav-btn active" data-page="data" data-i18n="navData">
            数据
          </button>
          <button type="button" class="nav-btn" data-page="news" data-i18n="navNews">
            新闻
          </button>
          <button type="button" class="nav-btn" data-page="calendar" data-i18n="navCalendar">
            日历
          </button>
          <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
        </div>
      </nav>
      <div class="ptr-indicator" id="ptrIndicator" hidden></div>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <script src="./js/i18n.js?v=20261016c"></script>
    <script src="./js/tz.js?v=20261016c"></script>
    <script src="./js/translate.js?v=20261016c"></script>
    <script src="./js/api.js?v=20261016c"></script>
    <script src="./js/kondratiev.js?v=20261016c"></script>
    <script src="./js/llm.js?v=20261016c"></script>
    <script src="./js/ai-ui.js?v=20261016c"></script>
    <script src="./js/agent.js?v=20261016c"></script>
    <script src="./js/cal-i18n.js?v=20261016c"></script>
    <script src="./js/charts.js?v=20261016d"></script>
    <script src="./js/pages/data.js?v=20261016c"></script>
    <script src="./js/pages/news.js?v=20261016c"></script>
    <script src="./js/pages/calendar.js?v=20261016c"></script>
    <script src="./js/app.js?v=20261016c"></script>
  </body>
</html>
